name: 24/7 Real Media
description: '24/7 Real Media was a New York digital advertising technology and media
  company formed when 24/7 Media merged with Real Media in 2001, acquiring the Open
  AdStream publisher ad server. Venture-backed (Trinity Ventures, Zero Stage Capital)
  before its NASDAQ listing, it was acquired by WPP Group in July 2007 for approximately
  $649 million ($11.75 per share) and run inside WPP Digital. The business was renamed
  24/7 Media, then merged into WPP''s programmatic arm Xaxis in January 2014, retiring
  the 24/7 brand; Open AdStream was rebranded Xaxis for Publishers and sold to AppNexus
  later that year. Xaxis itself was sunset into GroupM Nexus in January 2024. The company
  is defunct: it operates no website, developer portal, or public API surface today.'
